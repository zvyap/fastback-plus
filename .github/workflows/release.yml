name: release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^mod_version *= *//p' gradle.properties | tr -d '\r')
          test "$RELEASE_TAG" = "$version"
      - name: Test and build release JARs
        run: ./gradlew ciBuild --console=plain
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "fabric/build/libs/fastback-fabric-${RELEASE_TAG}.jar" \
            "neoforge/build/libs/fastback-neoforge-${RELEASE_TAG}.jar" \
            --verify-tag --title "$RELEASE_TAG" --generate-notes \
            --notes "FastBack for Minecraft 26.3. Includes dedicated server snapshot loading and English fallback text for translatable messages."
