name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.targets.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: echo "versions=$(jq -c 'keys' gradle/minecraft-versions.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJSON(needs.targets.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare deterministic test clock
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfaketime
          echo "FASTBACK_TEST_CLOCK=@$(date -u +%F) 12:00:00" >> "$GITHUB_ENV"
      - name: Test and build both loaders
        run: ./gradlew clean ciBuild -Pminecraft_version=${{ matrix.minecraft }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: fastback-${{ matrix.minecraft }}
          if-no-files-found: error
          path: |
            fabric/build/${{ matrix.minecraft }}/libs/fastback-fabric-*+${{ matrix.minecraft }}.jar
            neoforge/build/${{ matrix.minecraft }}/libs/fastback-neoforge-*+${{ matrix.minecraft }}.jar
